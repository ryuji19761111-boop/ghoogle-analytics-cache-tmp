<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Minecraft Skin Viewer</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(135deg, #1e1030 0%, #3a1f5c 50%, #2a1245 100%);
    font-family: 'Segoe UI', sans-serif;
    color: #f0e6ff;
    overflow: hidden;
  }
  #container { position: relative; width: 100%; height: 100vh; }
  #viewer3d { width: 100%; height: 100%; display: block; cursor: grab; }
  #viewer3d:active { cursor: grabbing; }

  .panel {
    position: absolute;
    top: 20px; left: 20px;
    background: rgba(20, 10, 40, 0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(180, 140, 255, 0.35);
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .panel h1 {
    font-size: 16px; margin: 0 0 6px 0;
    background: linear-gradient(90deg, #d9a8ff, #fff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel p { font-size: 12px; margin: 0; opacity: 0.75; }

  #controls {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px;
    background: rgba(20, 10, 40, 0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(180, 140, 255, 0.35);
    border-radius: 30px;
    padding: 8px 14px;
  }
  button {
    background: rgba(160, 100, 255, 0.25);
    border: 1px solid rgba(200, 150, 255, 0.5);
    color: #f0e6ff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover { background: rgba(180, 120, 255, 0.45); transform: translateY(-1px); }
  button.active { background: rgba(200, 140, 255, 0.6); }

  #sheetPanel {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(20, 10, 40, 0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(180, 140, 255, 0.35);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  #sheetPanel canvas {
    image-rendering: pixelated;
    border-radius: 8px;
    border: 1px solid rgba(180,140,255,0.3);
  }
  #sheetPanel p { font-size: 11px; margin: 6px 0 0 0; opacity: 0.7; }

  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px; opacity: 0.7;
  }
</style>
</head>
<body>

<div id="container">
  <div id="loading">読み込み中...</div>
  <canvas id="viewer3d"></canvas>

  <div class="panel">
    <h1>🎮 Minecraft Skin Viewer</h1>
    <p>ドラッグで回転 / スクロールでズーム</p>
  </div>

  <div id="sheetPanel">
    <canvas id="sheetCanvas" width="256" height="256"></canvas>
    <p>元スキンシート (64×64)</p>
  </div>

  <div id="controls">
    <button id="btnRotate" class="active">🔄 自動回転</button>
    <button id="btnFront">正面</button>
    <button id="btnBack">背面</button>
    <button id="btnReset">リセット</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SKIN_URL = 'skin.png';

// ---------- 元シート表示 ----------
const sheetCanvas = document.getElementById('sheetCanvas');
const sctx = sheetCanvas.getContext('2d');
sctx.imageSmoothingEnabled = false;

const skinImg = new Image();
skinImg.crossOrigin = 'anonymous';
skinImg.onload = () => {
  sctx.drawImage(skinImg, 0, 0, 256, 256);
  init3D();
};
skinImg.onerror = () => {
  document.getElementById('loading').textContent = 'スキン画像の読み込みに失敗しました';
};
skinImg.src = SKIN_URL;

// ---------- Three.js セットアップ ----------
let scene, camera, renderer, skinTexture;
let autoRotate = true;
let modelGroup;

function init3D() {
  document.getElementById('loading').style.display = 'none';

  const canvas = document.getElementById('viewer3d');
  const w = canvas.clientWidth, h = canvas.clientHeight;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, w / h, 0.1, 1000);
  camera.position.set(0, 8, 45);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);

  const ambient = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 0.6);
  dir.position.set(5, 10, 7);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x9a6bff, 0.3);
  dir2.position.set(-5, -5, -5);
  scene.add(dir2);

  // テクスチャ生成
  const canvasTex = document.createElement('canvas');
  canvasTex.width = 64; canvasTex.height = 64;
  const tctx = canvasTex.getContext('2d');
  tctx.imageSmoothingEnabled = false;
  tctx.drawImage(skinImg, 0, 0);

  skinTexture = new THREE.CanvasTexture(canvasTex);
  skinTexture.magFilter = THREE.NearestFilter;
  skinTexture.minFilter = THREE.NearestFilter;
  skinTexture.flipY = true;

  modelGroup = new THREE.Group();
  scene.add(modelGroup);

  buildPlayerModel(modelGroup, skinTexture);

  animate();
  attachControls(canvas);
}

// UV座標からマテリアル配列を作る関数 (テクスチャは64x64を基準に正規化)
function uvBox(w, h, d, faceCoords) {
  // faceCoords: {px, nx, py, ny, pz, nz} 各 [x, y, w, h] in texture pixels (64x64 base)
  const geo = new THREE.BoxGeometry(w, h, d);
  const uvAttr = geo.attributes.uv;
  const tw = 64, th = 64;

  function setFace(faceIndex, coords, flipX, flipY) {
    const [x, y, ww, hh] = coords;
    let u0 = x / tw, u1 = (x + ww) / tw;
    let v0 = 1 - (y + hh) / th, v1 = 1 - y / th;
    if (flipX) [u0, u1] = [u1, u0];
    // 4 vertices per face, 2 uv per vertex
    const base = faceIndex * 8;
    // order: (u1,v1) (u0,v1) (u1,v0) (u0,v0) matches BoxGeometry default winding often;
    // we'll just set all 4 corners appropriately
    uvAttr.setXY(faceIndex*4+0, u1, v1);
    uvAttr.setXY(faceIndex*4+1, u0, v1);
    uvAttr.setXY(faceIndex*4+2, u1, v0);
    uvAttr.setXY(faceIndex*4+3, u0, v0);
  }

  // BoxGeometry face order: +x, -x, +y, -y, +z, -z
  setFace(0, faceCoords.px);
  setFace(1, faceCoords.nx);
  setFace(2, faceCoords.py);
  setFace(3, faceCoords.ny);
  setFace(4, faceCoords.pz);
  setFace(5, faceCoords.nz);

  uvAttr.needsUpdate = true;
  return geo;
}

function makePart(w, h, d, faceCoords, texture, scale) {
  const geo = uvBox(w, h, d, faceCoords);
  const mat = new THREE.MeshLambertMaterial({ map: texture, transparent: true, alphaTest: 0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  return mesh;
}

function buildPlayerModel(group, texture) {
  const S = 1.4; // overall scale factor (1 minecraft pixel = S units)

  // ---- HEAD (8x8x8) ----
  const headGeo = uvBox(8*S, 8*S, 8*S, {
    px: [16,8,8,8],  // right
    nx: [0,8,8,8],   // left
    py: [8,0,8,8],   // top
    ny: [16,0,8,8],  // bottom
    pz: [8,8,8,8],   // front
    nz: [24,8,8,8],  // back
  });
  const headMat = new THREE.MeshLambertMaterial({ map: texture, transparent: true });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = (12+4)*S;
  group.add(head);

  // Head overlay (hat layer) 8x8x8 slightly bigger
  const headOGeo = uvBox(8.5*S, 8.5*S, 8.5*S, {
    px: [48,8,8,8],
    nx: [32,8,8,8],
    py: [40,0,8,8],
    ny: [48,0,8,8],
    pz: [40,8,8,8],
    nz: [56,8,8,8],
  });
  const headO = new THREE.Mesh(headOGeo, new THREE.MeshLambertMaterial({map: texture, transparent:true, alphaTest:0.5, side: THREE.DoubleSide}));
  headO.position.y = (12+4)*S;
  group.add(headO);

  // ---- BODY (8x12x4) ----
  const bodyGeo = uvBox(8*S, 12*S, 4*S, {
    px: [28,20,4,12],
    nx: [16,20,4,12],
    py: [20,16,8,4],
    ny: [28,16,8,4],
    pz: [20,20,8,12],
    nz: [32,20,8,12],
  });
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshLambertMaterial({map: texture, transparent:true}));
  body.position.y = 12*S;
  group.add(body);

  // Body overlay (jacket)
  const bodyOGeo = uvBox(8.5*S, 12.5*S, 4.5*S, {
    px: [28,36,4,12],
    nx: [16,36,4,12],
    py: [20,32,8,4],
    ny: [28,32,8,4],
    pz: [20,36,8,12],
    nz: [32,36,8,12],
  });
  const bodyO = new THREE.Mesh(bodyOGeo, new THREE.MeshLambertMaterial({map: texture, transparent:true, alphaTest:0.5, side: THREE.DoubleSide}));
  bodyO.position.y = 12*S;
  group.add(bodyO);

  // ---- ARMS (4x12x4) each ----
  function buildArm(isRight) {
    const armX = isRight ? [40,20,4,12] : [40,20,4,12]; // right arm uses right-arm texture region (slim/classic same base coords used commonly)
    // Classic (non-slim) arm UV regions:
    // Right arm: standard skin region x=40,y=16 (8x4 top/bottom) body 40,20 4x12
    const coords = isRight ? {
      px: [44,20,4,12],
      nx: [36,20,4,12],
      py: [40,16,4,4],
      ny: [44,16,4,4],
      pz: [40,20,4,12],
      nz: [48,20,4,12],
    } : {
      px: [36,52,4,12],
      nx: [44,52,4,12],
      py: [44,48,4,4],
      ny: [48,48,4,4],
      pz: [40,52,4,12],
      nz: [48,52,4,12],
    };
    const geo = uvBox(4*S, 12*S, 4*S, coords);
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({map: texture, transparent:true}));
    return mesh;
  }

  const rightArm = buildArm(true);
  rightArm.position.set(-6*S, 12*S, 0);
  group.add(rightArm);

  const leftArm = buildArm(false);
  leftArm.position.set(6*S, 12*S, 0);
  group.add(leftArm);

  // Arm overlays (sleeves)
  function buildArmOverlay(isRight) {
    const coords = isRight ? {
      px: [44,36,4,12],
      nx: [36,36,4,12],
      py: [40,32,4,4],
      ny: [44,32,4,4],
      pz: [40,36,4,12],
      nz: [48,36,4,12],
    } : {
      px: [52,52,4,12],
      nx: [60,52,4,12],
      py: [56,48,4,4],
      ny: [60,48,4,4],
      pz: [48,52,4,12],
      nz: [56,52,4,12],
    };
    const geo = uvBox(4.5*S, 12.5*S, 4.5*S, coords);
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({map: texture, transparent:true, alphaTest:0.5, side: THREE.DoubleSide}));
    return mesh;
  }
  const rightArmO = buildArmOverlay(true);
  rightArmO.position.set(-6*S, 12*S, 0);
  group.add(rightArmO);

  const leftArmO = buildArmOverlay(false);
  leftArmO.position.set(6*S, 12*S, 0);
  group.add(leftArmO);

  // ---- LEGS (4x12x4) each ----
  function buildLeg(isRight) {
    const coords = isRight ? {
      px: [8,20,4,12],
      nx: [0,20,4,12],
      py: [4,16,4,4],
      ny: [8,16,4,4],
      pz: [4,20,4,12],
      nz: [12,20,4,12],
    } : {
      px: [24,52,4,12],
      nx: [16,52,4,12],
      py: [20,48,4,4],
      ny: [24,48,4,4],
      pz: [20,52,4,12],
      nz: [28,52,4,12],
    };
    const geo = uvBox(4*S, 12*S, 4*S, coords);
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({map: texture, transparent:true}));
    return mesh;
  }
  const rightLeg = buildLeg(true);
  rightLeg.position.set(-2*S, 0, 0);
  group.add(rightLeg);

  const leftLeg = buildLeg(false);
  leftLeg.position.set(2*S, 0, 0);
  group.add(leftLeg);

  // Leg overlays
  function buildLegOverlay(isRight) {
    const coords = isRight ? {
      px: [8,36,4,12],
      nx: [0,36,4,12],
      py: [4,32,4,4],
      ny: [8,32,4,4],
      pz: [4,36,4,12],
      nz: [12,36,4,12],
    } : {
      px: [8,52,4,12],
      nx: [0,52,4,12],
      py: [4,48,4,4],
      ny: [8,48,4,4],
      pz: [4,52,4,12],
      nz: [12,52,4,12],
    };
    const geo = uvBox(4.5*S, 12.5*S, 4.5*S, coords);
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({map: texture, transparent:true, alphaTest:0.5, side: THREE.DoubleSide}));
    return mesh;
  }
  const rightLegO = buildLegOverlay(true);
  rightLegO.position.set(-2*S, 0, 0);
  group.add(rightLegO);

  const leftLegO = buildLegOverlay(false);
  leftLegO.position.set(2*S, 0, 0);
  group.add(leftLegO);

  // center whole model
  group.position.y = -12*S;
}

function animate() {
  requestAnimationFrame(animate);
  if (autoRotate && modelGroup) {
    modelGroup.rotation.y += 0.008;
  }
  renderer.render(scene, camera);
}

// ---------- 操作 ----------
function attachControls(canvas) {
  let isDragging = false;
  let prevX = 0, prevY = 0;

  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    prevX = e.clientX; prevY = e.clientY;
    autoRotate = false;
    document.getElementById('btnRotate').classList.remove('active');
  });
  window.addEventListener('mouseup', () => isDragging = false);
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    modelGroup.rotation.y += dx * 0.01;
    modelGroup.rotation.x += dy * 0.01;
    modelGroup.rotation.x = Math.max(-1, Math.min(1, modelGroup.rotation.x));
    prevX = e.clientX; prevY = e.clientY;
  });

  // touch
  canvas.addEventListener('touchstart', (e) => {
    isDragging = true;
    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
    autoRotate = false;
    document.getElementById('btnRotate').classList.remove('active');
  }, {passive:true});
  window.addEventListener('touchend', () => isDragging = false);
  window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - prevX;
    const dy = e.touches[0].clientY - prevY;
    modelGroup.rotation.y += dx * 0.01;
    modelGroup.rotation.x += dy * 0.01;
    modelGroup.rotation.x = Math.max(-1, Math.min(1, modelGroup.rotation.x));
    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
  }, {passive:true});

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camera.position.z += e.deltaY * 0.02;
    camera.position.z = Math.max(15, Math.min(100, camera.position.z));
  }, {passive:false});

  window.addEventListener('resize', () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  document.getElementById('btnRotate').addEventListener('click', (e) => {
    autoRotate = !autoRotate;
    e.target.classList.toggle('active', autoRotate);
  });
  document.getElementById('btnFront').addEventListener('click', () => {
    modelGroup.rotation.y = 0;
    modelGroup.rotation.x = 0;
  });
  document.getElementById('btnBack').addEventListener('click', () => {
    modelGroup.rotation.y = Math.PI;
    modelGroup.rotation.x = 0;
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    modelGroup.rotation.set(0,0,0);
    camera.position.set(0, 8, 45);
  });
}
</script>
</body>
</html>
