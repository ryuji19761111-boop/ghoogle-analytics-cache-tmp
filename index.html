<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room System</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #0f1117;
    color: #fff;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: min(620px, 100%);
}

.card {
    background: #181b23;
    border: 1px solid #292e3a;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.description {
    margin: 0 0 24px;
    color: #9ca3af;
    line-height: 1.6;
}

.room-box {
    background: #10131a;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
}

.label {
    color: #8b93a3;
    font-size: 13px;
    margin-bottom: 6px;
}

.room-id {
    font-size: 24px;
    font-weight: 700;
    word-break: break-all;
}

.status {
    margin-top: 8px;
    color: #61d095;
    font-size: 14px;
}

.url-box {
    background: #10131a;
    border-radius: 12px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-all;
    color: #cbd5e1;
    margin-bottom: 18px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    width: 100%;
    padding: 13px 14px;
    border: 0;
    border-radius: 12px;
    cursor: pointer;

    background: #2b3140;
    color: #fff;

    font-size: 15px;
    font-weight: 700;
}

button:active {
    transform: scale(.98);
}

.primary {
    background: #5865f2;
}

input {
    width: 100%;
    margin-top: 10px;
    padding: 13px;

    border: 1px solid #303746;
    border-radius: 12px;

    background: #0f1117;
    color: #fff;

    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #5865f2;
}

.room-list {
    margin-top: 18px;
}

.room-item {
    background: #10131a;
    border: 1px solid #292e3a;
    border-radius: 12px;
    padding: 13px;
    margin-top: 8px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.room-item span {
    word-break: break-all;
}

.small-btn {
    width: auto;
    padding: 8px 11px;
    font-size: 13px;
}

.hidden {
    display: none;
}

.notice {
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    background: #241f12;
    color: #e8c66a;
    font-size: 13px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Room System</h1>

        <p class="description">
            同じページURLでも、末尾の room パラメータによって
            別々の部屋として扱います。
        </p>

        <!-- 現在の部屋 -->
        <div id="roomArea" class="room-box">
            <div class="label">現在のルーム</div>

            <div id="roomId" class="room-id">
                -
            </div>

            <div id="roomStatus" class="status">
                -
            </div>
        </div>

        <!-- 現在のURL -->
        <div class="label">現在のURL</div>

        <div id="currentUrl" class="url-box">
            -
        </div>

        <!-- 新しい部屋 -->
        <div class="label">
            部屋IDを入力して移動
        </div>

        <input
            id="roomInput"
            type="text"
            placeholder="例: ABC123"
            maxlength="50"
        >

        <div class="buttons">
            <button
                class="primary"
                onclick="openRoom()"
            >
                部屋を開く
            </button>

            <button
                onclick="copyRoomURL()"
            >
                URLをコピー
            </button>
        </div>

        <div class="notice">
            このバージョンではFirebaseなどの保存機能を使っていません。
            部屋IDはURLから読み取って判定します。
        </div>

        <!-- 事前定義された部屋 -->
        <div id="roomList" class="room-list">

            <div class="label">
                事前に用意されたルーム
            </div>

            <div class="room-item">
                <span>AAA111</span>

                <button
                    class="small-btn"
                    onclick="openPredefinedRoom('AAA111')"
                >
                    開く
                </button>
            </div>

            <div class="room-item">
                <span>BBB222</span>

                <button
                    class="small-btn"
                    onclick="openPredefinedRoom('BBB222')"
                >
                    開く
                </button>
            </div>

            <div class="room-item">
                <span>CCC333</span>

                <button
                    class="small-btn"
                    onclick="openPredefinedRoom('CCC333')"
                >
                    開く
                </button>
            </div>

        </div>

    </div>

</div>


<script>
/*
==================================================
  Room System
==================================================

同じページ:

https://example.github.io/room/

でも、

?room=AAA111
?room=BBB222

のように末尾を変えることで
別のルームとして扱う。
*/


/*
--------------------------------------------------
現在のURLから room を取得
--------------------------------------------------
*/

function getRoomId() {

    const params = new URLSearchParams(
        window.location.search
    );

    return params.get("room");
}


/*
--------------------------------------------------
URLを作成
--------------------------------------------------
*/

function createRoomURL(roomId) {

    const url = new URL(
        window.location.href
    );

    url.search = "";

    url.searchParams.set(
        "room",
        roomId
    );

    return url.toString();
}


/*
--------------------------------------------------
ルームIDの簡易チェック
--------------------------------------------------
*/

function isValidRoomId(roomId) {

    if (!roomId) {
        return false;
    }

    /*
    英数字・ハイフン・アンダースコアのみ
    */

    return /^[A-Za-z0-9_-]{1,50}$/.test(
        roomId
    );
}


/*
--------------------------------------------------
画面を更新
--------------------------------------------------
*/

function updateRoom() {

    const roomId = getRoomId();

    const roomIdElement =
        document.getElementById("roomId");

    const statusElement =
        document.getElementById("roomStatus");

    const currentUrlElement =
        document.getElementById("currentUrl");


    currentUrlElement.textContent =
        window.location.href;


    /*
    room がない場合
    */

    if (!roomId) {

        roomIdElement.textContent =
            "部屋が指定されていません";

        statusElement.textContent =
            "URLに ?room=部屋ID を付けてください";

        statusElement.style.color =
            "#e8c66a";

        return;
    }


    /*
    不正なID
    */

    if (!isValidRoomId(roomId)) {

        roomIdElement.textContent =
            "不正な部屋ID";

        statusElement.textContent =
            "使用できない文字が含まれています";

        statusElement.style.color =
            "#ef7777";

        return;
    }


    /*
    正常
    */

    roomIdElement.textContent =
        roomId;

    statusElement.textContent =
        "このURLはルーム「" +
        roomId +
        "」として扱われています。";

    statusElement.style.color =
        "#61d095";
}


/*
--------------------------------------------------
入力された部屋へ移動
--------------------------------------------------
*/

function openRoom() {

    const input =
        document.getElementById("roomInput");

    const roomId =
        input.value.trim();


    if (!isValidRoomId(roomId)) {

        alert(
            "部屋IDを入力してください。\n\n" +
            "使用できる文字: A-Z / a-z / 0-9 / _ / -"
        );

        return;
    }


    window.location.href =
        createRoomURL(roomId);
}


/*
--------------------------------------------------
事前定義ルーム
--------------------------------------------------
*/

function openPredefinedRoom(roomId) {

    window.location.href =
        createRoomURL(roomId);
}


/*
--------------------------------------------------
現在のルームURLをコピー
--------------------------------------------------
*/

async function copyRoomURL() {

    const roomId =
        getRoomId();


    if (!roomId) {

        alert(
            "現在ルームが指定されていません。"
        );

        return;
    }


    const url =
        createRoomURL(roomId);


    try {

        await navigator.clipboard.writeText(
            url
        );

        alert(
            "ルームURLをコピーしました。"
        );

    } catch (error) {

        /*
        Clipboard APIが使えない環境用
        */

        const textarea =
            document.createElement("textarea");

        textarea.value = url;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

        alert(
            "ルームURLをコピーしました。"
        );
    }
}


/*
--------------------------------------------------
Enterキー対応
--------------------------------------------------
*/

document
    .getElementById("roomInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                openRoom();
            }
        }
    );


/*
--------------------------------------------------
起動
--------------------------------------------------
*/

updateRoom();
</script>

</body>
</html>
