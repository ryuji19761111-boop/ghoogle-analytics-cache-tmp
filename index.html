<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Access</title>

<style>
:root{
    --bg:#0b0b0f;
    --card:#16161d;
    --card2:#20202a;
    --line:#2c2c39;
    --line2:#333344;
    --text:#ffffff;
    --muted:#999;
    --blue:#5865f2;
    --cyan:#00d4ff;
    --green:#00ffae;
    --ok:#00c853;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
}

html{ -webkit-tap-highlight-color:transparent; }

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
}

/* ---------- background ---------- */
.bg{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
}
.orb{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.22;
    animation:float 18s ease-in-out infinite alternate;
}
.o1{ background:var(--blue); top:-120px; left:-100px; }
.o2{ background:var(--cyan); bottom:-140px; right:-120px; animation-delay:-9s; }

@keyframes float{
    from{ transform:translate(0,0) scale(1); }
    to{ transform:translate(40px,30px) scale(1.15); }
}

/* ---------- layout ---------- */
.container{
    width:100%;
    max-width:460px;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:25px;
    box-shadow:
    0 0 25px rgba(0,0,0,.5),
    inset 0 0 25px rgba(255,255,255,.02);
    animation:enter .6s ease;
}
.hidden{ display:none !important; }

@keyframes enter{
    from{ opacity:0; transform:translateY(14px) scale(.98); }
    to{ opacity:1; transform:none; }
}

/* ---------- logo ---------- */
.brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:22px;
}
.logoMark{
    width:64px;
    height:64px;
    margin-bottom:10px;
    filter:drop-shadow(0 0 12px rgba(88,101,242,.55));
    animation:glow 3.2s ease-in-out infinite;
}
@keyframes glow{
    0%,100%{ filter:drop-shadow(0 0 8px rgba(88,101,242,.45)); }
    50%{ filter:drop-shadow(0 0 18px rgba(0,212,255,.7)); }
}
.logo{
    font-size:34px;
    font-weight:bold;
    text-align:center;
    margin-bottom:6px;
    letter-spacing:2px;
    background:linear-gradient(90deg,#fff,#b9c1ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.sub{
    text-align:center;
    color:var(--muted);
}

/* ---------- device ---------- */
.device{
    background:var(--card2);
    border-radius:12px;
    padding:12px;
    margin-bottom:20px;
    font-size:13px;
    color:#ccc;
    border:1px solid var(--line2);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ---------- progress ---------- */
.progressHead{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    margin-bottom:8px;
}
.progressWrap{
    width:100%;
    height:16px;
    background:#242430;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:25px;
}
.progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--blue),var(--cyan),var(--blue));
    background-size:200% 100%;
    transition:width .5s ease;
    animation:shimmer 3s linear infinite;
}
@keyframes shimmer{
    from{ background-position:0% 0; }
    to{ background-position:200% 0; }
}

/* ---------- step ---------- */
.step{
    background:var(--card2);
    border:1px solid var(--line2);
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    transition:opacity .3s, border-color .3s, transform .3s;
}
.step[data-state="locked"]{ opacity:.45; }
.step[data-state="running"]{ border-color:var(--blue); }
.step[data-state="done"]{ border-color:rgba(0,255,174,.45); }

.stepTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}
.stepNum{
    background:var(--blue);
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
}
.step[data-state="done"] .stepNum{ background:var(--ok); }
.badge{ font-size:13px; color:#bbb; }

.stepHead{
    display:flex;
    align-items:center;
    gap:10px;
}
.icon{
    width:34px;
    height:34px;
    border-radius:10px;
    background:rgba(88,101,242,.16);
    color:#aab2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
}
.icon svg{ width:18px; height:18px; }

.ad{
    background:#111;
    border-radius:12px;
    padding:14px;
    margin:14px 0;
    border:1px solid #2a2a2a;
    color:#aaa;
    font-size:13px;
}

button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    color:white;
}
button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

.taskBtn{ background:var(--blue); }
.taskBtn:hover:not(:disabled){ transform:scale(1.02); }
.taskBtn:disabled{ opacity:.6; cursor:not-allowed; }
.step[data-state="running"] .taskBtn{ background:#3c46b8; }
.step[data-state="done"] .taskBtn{ background:#1f6b4d; }

.loader{
    width:100%;
    height:8px;
    background:#2b2b35;
    border-radius:999px;
    overflow:hidden;
    margin-top:14px;
    display:none;
}
.step[data-state="running"] .loader{ display:block; }
.loaderFill{
    width:0%;
    height:100%;
    background:var(--green);
    transition:width .4s ease;
}

.hint{
    margin-top:10px;
    font-size:13px;
    color:#aaa;
    line-height:1.5;
}
.hint:empty{ display:none; }
.done{ color:var(--green); font-size:14px; animation:pop .4s ease; }
@keyframes pop{
    from{ transform:scale(.85); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}

/* ---------- verify (hold) ---------- */
.verify{
    margin-top:18px;
    background:#1e1e26;
    border-radius:14px;
    padding:15px;
    border:1px solid var(--line2);
}
.verifyLabel{
    font-size:13px;
    color:#bbb;
    margin-bottom:10px;
}
.holdBtn{
    position:relative;
    overflow:hidden;
    background:#2b2b38;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
}
.holdBtn:disabled{ opacity:.5; cursor:not-allowed; }
.holdFill{
    position:absolute;
    inset:0 auto 0 0;
    width:0%;
    background:linear-gradient(90deg,var(--blue),var(--cyan));
}
.holdText{ position:relative; }
.holdBtn.ok .holdFill{ width:100% !important; background:var(--ok); }

.unlockBtn{
    margin-top:10px;
    background:var(--ok);
    display:none;
    animation:pop .4s ease;
}
.unlockBtn.show{ display:block; }

.footer{
    text-align:center;
    color:#666;
    margin-top:20px;
    font-size:12px;
}

/* ---------- granted ---------- */
.granted{
    text-align:center;
    padding:40px 25px;
}
.granted .logoMark{ width:80px; height:80px; }
.granted h2{ font-size:28px; margin:8px 0 12px; }
.granted p{ color:var(--muted); font-size:15px; }
.granted a{ color:var(--cyan); font-size:14px; display:inline-block; margin-top:16px; }

/* ---------- toast ---------- */
.toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%,30px);
    background:#22222c;
    border:1px solid var(--line2);
    padding:12px 18px;
    border-radius:12px;
    font-size:14px;
    max-width:90%;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>

<body>

<div class="bg"><span class="orb o1"></span><span class="orb o2"></span></div>

<main class="container">

<!-- ================= MAIN VIEW ================= -->
<section class="card" id="viewMain">

<div class="brand">
    <!-- LOGO: 差し替えるときはこの <svg> を <img src="..."> に置き換えるだけでOK -->
    <svg class="logoMark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5865f2"/>
                <stop offset="1" stop-color="#00d4ff"/>
            </linearGradient>
        </defs>
        <path d="M32 4L56 18V46L32 60L8 46V18Z" fill="rgba(88,101,242,.12)" stroke="url(#lg)" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="32" cy="27" r="7" fill="none" stroke="url(#lg)" stroke-width="3.5"/>
        <path d="M32 34V47M32 41H38" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="logo" id="brandName">ACCESS</div>
    <div class="sub">Complete tasks to unlock access</div>
</div>

<div class="device" id="deviceInfo">Device Detecting...</div>

<div class="progressHead">
    <span>Progress</span>
    <span id="progressLabel">0 / 4</span>
</div>
<div class="progressWrap">
    <div class="progressBar" id="progressBar"></div>
</div>

<div id="steps"></div>

<div class="verify">
    <div class="verifyLabel">Human check: hold the button until it fills</div>
    <button class="holdBtn" id="holdBtn" type="button" disabled>
        <span class="holdFill" id="holdFill"></span>
        <span class="holdText" id="holdText">Complete all tasks first</span>
    </button>
</div>

<button class="unlockBtn" id="unlockBtn" type="button">UNLOCK ACCESS</button>

<div class="footer">Task-based access • v2</div>

</section>

<!-- ================= GRANTED VIEW ================= -->
<section class="card granted hidden" id="viewGranted">
    <svg class="logoMark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 4L56 18V46L32 60L8 46V18Z" fill="rgba(0,200,83,.14)" stroke="#00ffae" stroke-width="3" stroke-linejoin="round"/>
        <path d="M21 33l8 8 15-17" stroke="#00ffae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <h2>ACCESS GRANTED</h2>
    <p id="redirectText">Redirecting...</p>
    <a id="manualLink" href="#" rel="noopener">Not redirected? Continue</a>
</section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* =====================================================
   CONFIG  ← ここだけ触れば内容を変えられます
   ===================================================== */
const CONFIG = {
    brand: "ACCESS",
    destination: "https://ryuji19761111-boop.github.io/ghoogle-analytics-cache-tmp/#/s/SV-f50uxuy2",   // 解除後の移動先
    redirectDelayMs: 2500,
    holdMs: 1500,                              // 「人間チェック」長押し時間
    stateKey: "acc_state_v2",
    tasks: [
        { id:1, title:"YouTube Promotion", desc:"Sponsored Task • Watch content for 15 seconds",
          url:"https://www.youtube.com/live/SlpcNYFuuWw?si=AOzf74DcGzhTyFVK", seconds:15, icon:"play" },
        { id:2, title:"Discord Community", desc:"Sponsored Task • Stay on the page for 15 seconds",
          url:"https://discord.gg/phZmJC2Fk", seconds:15, icon:"chat" },
        { id:3, title:"Follow on X", desc:"Sponsored Task • Visit the profile for 15 seconds",
          url:"https://x.com/roblox", seconds:15, icon:"x" },          // ← 自分のURLに変更
        { id:4, title:"Roblox Group", desc:"Sponsored Task • Visit the group for 15 seconds",
          url:"https://www.roblox.com/share?code=e8eccbf6a3f6e54cad62c7893f7f8b64&type=Experience", seconds:15, icon:"cube" } // ← 自分のURLに変更
    ]
};
CONFIG.tasks.forEach(Object.freeze);
Object.freeze(CONFIG.tasks);
Object.freeze(CONFIG);

const ICONS = {
    play:'<polygon points="6 4 20 12 6 20 6 4"/>',
    chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1.2-4.6A8 8 0 1 1 21 12z"/>',
    x:'<path d="M5 5l14 14M19 5L5 19"/>',
    cube:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12v9M12 12L4 7.5"/>'
};

/* =====================================================
   小道具
   ===================================================== */
const $ = id => document.getElementById(id);
const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");
const rand = () => hex(crypto.getRandomValues(new Uint8Array(12)));

async function hash(str){
    if (window.crypto && crypto.subtle){
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return hex(new Uint8Array(buf));
    }
    // 古い/非セキュア環境用の簡易ハッシュ (cyrb53)
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++){
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

let toastTimer = null;
function toast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* =====================================================
   Backend  ← 将来ここだけサーバー(fetch)に置き換える
   -----------------------------------------------------
   今はブラウザ内で検証しているので「簡単なズルの抑止」
   レベルです。本当に守るには、サーバー側で
   ・開始時刻/経過時間を自分の時計で測る
   ・完了トークンを署名して発行する
   ・最終的なリンクはトークン検証後にだけ返す
   を行い、下の3つを fetch("/api/...") に変えてください。
   ===================================================== */
const SECRET = "change-me-before-release";

const Backend = {
    // POST /api/task/start   → { nonce }
    async startTask(sid, task){
        return { nonce: rand() };
    },
    // POST /api/task/complete → { proof }   (サーバーは自前の時計で経過時間を確認)
    async completeTask(sid, task, nonce, awayMs){
        if (!nonce || awayMs < task.seconds * 1000 - 250) throw new Error("not enough time");
        const proof = await hash([SECRET, sid, task.id, nonce, Math.floor(awayMs / 1000)].join("|"));
        return { proof };
    },
    // POST /api/unlock → { url }   (全タスクの証明を検証してから返す)
    async unlock(sid, records){
        for (const t of CONFIG.tasks){
            const r = records[t.id];
            if (!r || r.status !== "done") return { ok:false };
            const expect = await hash([SECRET, sid, t.id, r.nonce, Math.floor(r.awayMs / 1000)].join("|"));
            if (expect !== r.proof) return { ok:false };
        }
        return { ok:true, url: CONFIG.destination };
    }
};

/* =====================================================
   State (グローバルに出さない = コンソールから触りにくい)
   ===================================================== */
let S = null;                // { sid, tasks:{ [id]: {status,nonce,awayMs,hiddenWall,proof} } }
let human = false;           // メモリのみ。リロードでリセット
let hiddenPerf = null;       // ページが隠れた時の performance.now()
const finishing = new Set();
let saveChain = Promise.resolve();

const fresh = () => ({ sid: rand(), tasks: {} });

async function load(){
    try{
        const raw = localStorage.getItem(CONFIG.stateKey);
        if (!raw) return fresh();
        const { p, sig } = JSON.parse(raw);
        if (sig !== await hash(p + SECRET)) { toast("Session was reset"); return fresh(); }
        return JSON.parse(p);
    }catch(e){ return fresh(); }
}

function save(){
    saveChain = saveChain.then(async () => {
        try{
            const p = JSON.stringify(S);
            localStorage.setItem(CONFIG.stateKey, JSON.stringify({ p, sig: await hash(p + SECRET) }));
        }catch(e){ /* 保存できない環境でも動作は続ける */ }
    });
}

/* =====================================================
   タスクのロジック
   ===================================================== */
function statusOf(task){
    // 前のタスクが終わっていなければ locked (DOMをいじっても無効)
    for (const t of CONFIG.tasks){
        if (t.id === task.id) break;
        const r = S.tasks[t.id];
        if (!r || r.status !== "done") return "locked";
    }
    const r = S.tasks[task.id];
    if (!r) return "idle";
    return r.status;   // "running" | "done"
}

const runningTask = () => CONFIG.tasks.find(t => S.tasks[t.id] && S.tasks[t.id].status === "running" && statusOf(t) === "running");

function onTaskClick(task, ev){
    if (!ev.isTrusted) return;                       // スクリプトからの偽クリックは無効
    const st = statusOf(task);
    if (st === "locked" || st === "done") return;

    // ポップアップブロック回避のため、同期でリンクを開く
    const w = window.open(task.url, "_blank");
    if (!w){ toast("Popup blocked. Allow popups and try again."); return; }
    try{ w.opener = null; }catch(e){}

    if (st === "idle"){
        S.tasks[task.id] = { status:"running", nonce:null, awayMs:0, hiddenWall:null, proof:null };
        Backend.startTask(S.sid, task).then(r => { S.tasks[task.id].nonce = r.nonce; save(); render(); });
        save();
    }
    render();
}

// ページが見えなくなった = ユーザーが別タブでタスクを見ている
function onVisibility(){
    const t = runningTask();
    if (document.visibilityState === "hidden"){
        hiddenPerf = performance.now();
        if (t){ S.tasks[t.id].hiddenWall = Date.now(); save(); }
    }else{
        credit();
    }
}

// 離れていた時間を加算 (時計いじり対策で performance.now と Date.now の小さい方を採用)
function credit(){
    const t = runningTask();
    if (!t){ hiddenPerf = null; return; }
    const r = S.tasks[t.id];
    if (r.hiddenWall == null){ hiddenPerf = null; return; }

    let d = Date.now() - r.hiddenWall;
    if (hiddenPerf != null) d = Math.min(d, performance.now() - hiddenPerf);
    r.hiddenWall = null;
    hiddenPerf = null;
    if (d > 0) r.awayMs += d;
    save();
    render();

    const need = t.seconds * 1000;
    if (r.awayMs >= need) finishTask(t);
    else toast(Math.ceil((need - r.awayMs) / 1000) + "s left. Go back to the task tab.");
}

async function finishTask(task){
    if (finishing.has(task.id)) return;
    finishing.add(task.id);
    const r = S.tasks[task.id];
    try{
        if (!r.nonce) r.nonce = (await Backend.startTask(S.sid, task)).nonce;
        const { proof } = await Backend.completeTask(S.sid, task, r.nonce, r.awayMs);
        r.proof = proof;
        r.status = "done";
        save();
        toast("Task " + task.id + " completed");
    }catch(e){
        toast("Verification failed. Please redo the task.");
        delete S.tasks[task.id];
        save();
    }
    finishing.delete(task.id);
    render();
}

/* =====================================================
   描画
   ===================================================== */
const els = {};

function buildSteps(){
    const wrap = $("steps");
    wrap.innerHTML = "";
    CONFIG.tasks.forEach(t => {
        const d = document.createElement("div");
        d.className = "step";
        d.innerHTML =
            '<div class="stepTop"><div class="stepNum">STEP ' + t.id + '</div><div class="badge"></div></div>' +
            '<div class="stepHead"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[t.icon] || ICONS.cube) + '</svg></span><h3></h3></div>' +
            '<div class="ad"></div>' +
            '<button class="taskBtn" type="button"></button>' +
            '<div class="loader"><div class="loaderFill"></div></div>' +
            '<div class="hint"></div>';
        d.querySelector("h3").textContent = t.title;
        d.querySelector(".ad").textContent = t.desc;
        d.querySelector(".taskBtn").addEventListener("click", ev => onTaskClick(t, ev));
        wrap.appendChild(d);
        els[t.id] = {
            root:d,
            badge:d.querySelector(".badge"),
            btn:d.querySelector(".taskBtn"),
            fill:d.querySelector(".loaderFill"),
            hint:d.querySelector(".hint")
        };
    });
}

function render(){
    let done = 0, partial = 0;

    CONFIG.tasks.forEach(t => {
        const st = statusOf(t);
        const e = els[t.id];
        const r = S.tasks[t.id];
        e.root.dataset.state = st;

        if (st === "done") done++;

        if (st === "locked"){
            e.badge.textContent = "Locked";
            e.btn.textContent = "Locked";
            e.btn.disabled = true;
            e.hint.textContent = "";
        }else if (st === "idle"){
            e.badge.textContent = "Required";
            e.btn.textContent = "Start Task";
            e.btn.disabled = false;
            e.hint.textContent = "";
        }else if (st === "running"){
            const need = t.seconds * 1000;
            const away = Math.min(r.awayMs, need);
            partial += away / need;
            const left = Math.ceil((need - away) / 1000);
            e.badge.textContent = "In progress";
            e.btn.textContent = "Reopen link";
            e.btn.disabled = false;
            e.fill.style.width = (away / need * 100) + "%";
            e.hint.textContent = "Stay on the opened tab for " + left + "s. The timer only runs while you are away from this page.";
        }else{
            e.badge.textContent = "Done ✔";
            e.btn.textContent = "Completed ✔";
            e.btn.disabled = true;
            e.hint.innerHTML = '<div class="done">✔ Task Completed</div>';
        }
    });

    const total = CONFIG.tasks.length;
    $("progressBar").style.width = ((done + partial) / total * 100) + "%";
    $("progressLabel").textContent = done + " / " + total;

    const all = done === total;
    const hold = $("holdBtn");
    hold.disabled = !all || human;
    hold.classList.toggle("ok", human);
    $("holdText").textContent = human ? "Verified ✔" : (all ? "Hold to verify" : "Complete all tasks first");
    $("unlockBtn").classList.toggle("show", all && human);
}

/* =====================================================
   長押しの人間チェック
   ===================================================== */
function setupHold(){
    const btn = $("holdBtn"), fill = $("holdFill");
    let t0 = null, raf = 0;

    const stop = () => {
        t0 = null;
        cancelAnimationFrame(raf);
        if (!human) fill.style.width = "0%";
    };
    const tick = () => {
        if (t0 == null) return;
        const p = Math.min(1, (performance.now() - t0) / CONFIG.holdMs);
        fill.style.width = (p * 100) + "%";
        if (p >= 1){ human = true; stop(); render(); return; }
        raf = requestAnimationFrame(tick);
    };
    const start = ev => {
        if (!ev.isTrusted || btn.disabled || human) return;
        t0 = performance.now();
        raf = requestAnimationFrame(tick);
    };

    btn.addEventListener("pointerdown", start);
    ["pointerup","pointerleave","pointercancel"].forEach(n => btn.addEventListener(n, stop));
    btn.addEventListener("contextmenu", e => e.preventDefault());
    btn.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat){ e.preventDefault(); start(e); } });
    btn.addEventListener("keyup", stop);
}

/* =====================================================
   解除
   ===================================================== */
async function unlock(ev){
    if (!ev.isTrusted || !human) return;
    const res = await Backend.unlock(S.sid, S.tasks);
    if (!res.ok){
        toast("Verification failed. Please redo the tasks.");
        S = fresh(); human = false; save(); render();
        return;
    }
    try{ localStorage.removeItem(CONFIG.stateKey); }catch(e){}

    $("viewMain").classList.add("hidden");
    $("viewGranted").classList.remove("hidden");
    $("manualLink").href = res.url;
    setTimeout(() => { window.location.href = res.url; }, CONFIG.redirectDelayMs);
}

/* =====================================================
   起動
   ===================================================== */
function deviceInfo(){
    const ua = navigator.userAgent;
    const os = /Android/i.test(ua) ? "Android" : /iPhone|iPad|iPod/i.test(ua) ? "iOS" :
               /Windows/i.test(ua) ? "Windows" : /Mac/i.test(ua) ? "macOS" : /Linux/i.test(ua) ? "Linux" : "Unknown";
    const br = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /Firefox\//.test(ua) ? "Firefox" :
               /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "Browser";
    $("deviceInfo").textContent = "Device: " + os + " • " + br + " • " + screen.width + "×" + screen.height;
}

async function init(){
    $("brandName").textContent = CONFIG.brand;
    deviceInfo();
    S = await load();
    buildSteps();
    setupHold();
    $("unlockBtn").addEventListener("click", unlock);
    document.addEventListener("visibilitychange", onVisibility);
    render();
    // ページが破棄→再読み込みされた場合も、離れていた時間を反映
    if (document.visibilityState === "visible") credit();
}

init();
})();
</script>
